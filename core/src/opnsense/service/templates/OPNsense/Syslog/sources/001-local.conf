    internal(); //internal source for messages generated by syslog-ng itself
    file("/dev/klog" follow-freq(0) flags(no-parse) program-override("kernel")); //get log messages from the kernel /dev/klog
    unix-dgram("/var/run/log" flags(syslog-protocol));  //a socket for all processes to write in (this is the main source)
    unix-dgram("/var/run/logpriv" perm(0600) flags(syslog-protocol));  //a socket for privileged processes (0600 permission: read/write only)
